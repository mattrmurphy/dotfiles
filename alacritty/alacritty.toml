import = ["/Users/matt/.config/alacritty/catppuccin-mocha.toml"]

[font]
size = 12.0

[font.bold]
family = "Hack"

[font.italic]
family = "Hack"

[font.normal]
family = "FiraMono Nerd Font"

[window]
# "Buttonless" only available on MacOS
decorations = "Buttonless"
# "None" for use with Linux
#decorations = "None"
dynamic_title = true
startup_mode = "Maximized"
opacity = 0.9

[window.padding]
x = 10
y = 10
